name: Add Yandex Metrika to all pages

# Запуск вручную: GitHub -> Actions -> "Add Yandex Metrika to all pages" -> Run workflow
#
# ВАЖНО, два отличия от первой версии:
#   1. Из сообщения коммита убран [skip ci]. Он запрещал запуск других workflow,
#      то есть отменял автодеплой сайта: счётчик попадал в репозиторий,
#      но на живой сайт не выкладывался.
#   2. dry_run по умолчанию false, чтобы случайный запуск "вроде нажал, а ничего
#      не поменялось" больше не происходил. Хочешь предпросмотр — включи галочку сам.
on:
  workflow_dispatch:
    inputs:
      metrika_id:
        description: 'Номер счётчика (пусто = возьмётся из переменной METRIKA_ID)'
        type: string
        default: '111297297'
      dry_run:
        description: 'Только показать, ничего не менять'
        type: boolean
        default: false
      force:
        description: 'Переписать блок даже там, где он уже есть (нужно для обновления версии)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  metrika:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve counter id
        id: cid
        env:
          INPUT_ID: ${{ inputs.metrika_id }}
          VAR_ID: ${{ vars.METRIKA_ID }}
        run: |
          ID="$INPUT_ID"
          if [ -z "$ID" ]; then ID="$VAR_ID"; fi
          case "$ID" in
            ''|*[!0-9]*)
              echo "::error::Нет номера счётчика. Задай его в поле metrika_id при запуске или создай переменную METRIKA_ID в Settings -> Secrets and variables -> Actions -> Variables."
              exit 1
              ;;
          esac
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Счётчик: $ID"

      - name: Run add_metrika.py
        env:
          METRIKA_ID: ${{ steps.cid.outputs.id }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "python3 add_metrika.py . $ARGS"
          python3 add_metrika.py . $ARGS

      - name: Verify counter is really in the files
        if: ${{ inputs.dry_run == false }}
        env:
          CID: ${{ steps.cid.outputs.id }}
        run: |
          TOTAL=$(find . -name '*.html' -not -path './.git/*' -not -path './.github/*' | wc -l)
          WITH=$(grep -rl "mc.yandex.ru" --include='*.html' . | wc -l)
          UTM=$(grep -rl "neoUtm" --include='*.html' . | wc -l)
          DOUBLE=$(grep -rc "metrika/tag.js" --include='*.html' . | awk -F: '$2>1' | wc -l)
          echo "Всего .html:            $TOTAL"
          echo "Со счётчиком:           $WITH"
          echo "С приёмом UTM (neoUtm): $UTM"
          echo "С ДВУМЯ счётчиками:     $DOUBLE"
          if [ "$DOUBLE" -gt 0 ]; then
            echo "::error::На некоторых страницах два счётчика — статистика удвоится. Список:"
            grep -rc "metrika/tag.js" --include='*.html' . | awk -F: '$2>1'
            exit 1
          fi
          if [ "$WITH" -eq 0 ]; then
            echo "::error::Счётчик не найден ни в одном файле — что-то пошло не так."
            exit 1
          fi

      - name: Commit and push
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Ничего не изменилось - коммит не нужен."
          else
            git add -A
            git commit -m "chore: update Yandex Metrika counter (v2, with UTM) on all pages"
            git push
          fi

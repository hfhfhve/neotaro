name: Add Metrika goals to landing and app

# Запуск вручную: GitHub -> Actions -> "Add Metrika goals to landing and app" -> Run workflow
#
# Правит только два файла: index.html (лендинг) и app/index.html (кабинет).
# Скрипт идемпотентен — повторный запуск ничего не дублирует.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Только показать, ничего не менять'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  goals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run add_goals.py
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "python3 add_goals.py . $ARGS"
          python3 add_goals.py . $ARGS

      - name: Check JS syntax
        if: ${{ inputs.dry_run == false }}
        run: |
          python3 - <<'PYEOF'
          import re, io, os, subprocess, sys

          RE = re.compile(r'<script([^>]*)>(.*?)</script>', re.S | re.I)
          os.makedirs('/tmp/jscheck', exist_ok=True)
          bad = 0

          for path in ('index.html', 'app/index.html'):
              if not os.path.isfile(path):
                  continue
              src = io.open(path, encoding='utf-8').read()
              n = 0
              for i, m in enumerate(RE.finditer(src)):
                  attrs, body = m.group(1), m.group(2)
                  low = attrs.lower()
                  if 'src=' in low:
                      continue
                  if 'type=' in low and 'javascript' not in low and 'module' not in low:
                      continue
                  if not body.strip():
                      continue
                  n += 1
                  f = '/tmp/jscheck/%s_%03d.js' % (path.replace('/', '_'), i)
                  io.open(f, 'w', encoding='utf-8').write(body)
                  r = subprocess.run(['node', '--check', f], capture_output=True, text=True)
                  if r.returncode != 0:
                      bad += 1
                      print('SYNTAX ERROR in %s (block %d):' % (path, i))
                      print(r.stderr[:1500])
              print('%s: proverено blokov %d' % (path, n))

          if bad:
              print('::error::Найдены синтаксические ошибки JS — коммит отменён')
              sys.exit(1)
          print('JS OK')
          PYEOF

      - name: Commit and push
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Ничего не изменилось - коммит не нужен."
          else
            git add -A
            git commit -m "feat: Metrika goals in landing and app [skip ci]"
            git push
          fi

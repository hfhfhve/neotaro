<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEOTARO — диагностика</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body{margin:0;padding:14px;background:#0B0F1E;color:#F2EDE0;
       font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5}
  h1{font-size:15px;color:#D9AE5F;margin:0 0 12px;letter-spacing:.1em}
  .row{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid rgba(217,174,95,.15);
       align-items:baseline;flex-wrap:wrap}
  .k{color:#93A0C0;flex:0 0 auto;min-width:132px}
  .v{color:#F0DDB0;word-break:break-all;flex:1;min-width:0}
  .ok{color:#93B9A0}
  .bad{color:#C4899B;font-weight:700}
  .box{margin-top:16px;padding:10px;border:1px solid rgba(217,174,95,.3);border-radius:8px}
  .probe{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
  @media(max-width:1000px){.probe{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:560px){.probe{grid-template-columns:1fr}}
  .probe div{background:rgba(217,174,95,.12);border:1px solid rgba(217,174,95,.3);
             padding:10px 6px;text-align:center;border-radius:6px}
  .dockprobe{display:none;margin-top:8px;padding:10px;text-align:center;
             background:rgba(147,185,160,.15);border:1px solid #93B9A0;border-radius:6px}
  @media(max-width:900px){.dockprobe{display:block}}
</style>
</head>
<body>
<h1>NEOTARO — ДИАГНОСТИКА УСТРОЙСТВА</h1>
<div id="out">считаю…</div>

<div class="box">
  <b style="color:#D9AE5F">ЖИВАЯ ПРОВЕРКА ВЁРСТКИ</b>
  <div class="probe"><div>1</div><div>2</div><div>3</div></div>
  <div style="color:#93A0C0;margin-top:6px">Сколько квадратов в ряду ↑</div>
  <div class="dockprobe">ПЛАШКА ВИДНА — узкий экран определён верно</div>
</div>

<script>
(function(){
  var L = [];
  function add(k, v, cls){
    L.push('<div class="row"><span class="k">' + k + '</span><span class="v ' +
           (cls || '') + '">' + String(v) + '</span></div>');
  }
  function mm(q){
    try { return window.matchMedia(q).matches; } catch(e){ return 'ошибка'; }
  }
  function yn(b){ return b === true ? 'ДА' : (b === false ? 'НЕТ' : b); }

  add('innerWidth', window.innerWidth + ' px', window.innerWidth > 900 ? 'bad' : 'ok');
  add('outerWidth', window.outerWidth + ' px');
  add('screen', screen.width + ' x ' + screen.height);
  add('devicePixelRatio', window.devicePixelRatio);
  add('visualViewport', window.visualViewport ? Math.round(window.visualViewport.width) + ' px' : 'нет');
  add('orientation', window.innerWidth > window.innerHeight ? 'ГОРИЗОНТ' : 'вертикаль');

  add('max-width:900', yn(mm('(max-width:900px)')), mm('(max-width:900px)') ? 'ok' : 'bad');
  add('max-width:1000', yn(mm('(max-width:1000px)')), mm('(max-width:1000px)') ? 'ok' : 'bad');
  add('max-width:560', yn(mm('(max-width:560px)')));
  add('pointer:coarse', yn(mm('(pointer:coarse)')));
  add('reduced-motion', yn(mm('(prefers-reduced-motion:reduce)')),
      mm('(prefers-reduced-motion:reduce)') ? 'bad' : 'ok');

  function sup(prop, val){
    try { return window.CSS && CSS.supports ? CSS.supports(prop, val) : 'нет CSS.supports'; }
    catch(e){ return 'ошибка'; }
  }
  add('CSS grid', yn(sup('display', 'grid')), sup('display','grid') ? 'ok' : 'bad');
  add('CSS gap', yn(sup('gap', '10px')), sup('gap','10px') ? 'ok' : 'bad');
  add('CSS aspect-ratio', yn(sup('aspect-ratio', '1')), sup('aspect-ratio','1') ? 'ok' : 'bad');
  add('CSS inset', yn(sup('inset', '0')));
  add('CSS backdrop', yn(sup('backdrop-filter', 'blur(2px)')));
  add('CSS clamp', yn(sup('width', 'clamp(1px,2px,3px)')), sup('width','clamp(1px,2px,3px)') ? 'ok' : 'bad');
  add('CSS :has', yn(sup('selector(:has(a))')));

  var ua = navigator.userAgent;
  var m = ua.match(/(Chrome|CriOS|Firefox|YaBrowser|SamsungBrowser|Version)\/([0-9.]+)/);
  add('Браузер', m ? m[1] + ' ' + m[2] : 'не определён', (m && parseInt(m[2],10) < 100) ? 'bad' : 'ok');
  add('UA', ua);
  add('Язык', navigator.language);
  add('Память', navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'н/д');
  add('Ядра', navigator.hardwareConcurrency || 'н/д');
  add('Онлайн', yn(navigator.onLine));
  add('saveData', navigator.connection ? yn(!!navigator.connection.saveData) : 'н/д',
      (navigator.connection && navigator.connection.saveData) ? 'bad' : '');
  add('Тип сети', navigator.connection ? (navigator.connection.effectiveType || 'н/д') : 'н/д');

  try {
    localStorage.setItem('__d', '1'); localStorage.removeItem('__d');
    add('localStorage', 'работает', 'ok');
  } catch(e){ add('localStorage', 'ЗАБЛОКИРОВАН', 'bad'); }

  add('Токен входа', localStorage.getItem('neotaro_token') ? 'есть' : 'нет');

  document.getElementById('out').innerHTML = L.join('');

  function more(html){ document.getElementById('out').innerHTML += html; }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(rs){
      more('<div class="row"><span class="k">SW зарегистр.</span><span class="v">' +
           rs.length + ' шт</span></div>');
      rs.forEach(function(r){
        var s = r.active ? r.active.scriptURL : (r.waiting ? 'waiting' : 'installing');
        more('<div class="row"><span class="k">SW scope</span><span class="v">' +
             r.scope + '<br>' + s + '</span></div>');
      });
      more('<div class="row"><span class="k">SW управляет</span><span class="v ' +
           (navigator.serviceWorker.controller ? 'bad' : 'ok') + '">' +
           (navigator.serviceWorker.controller ? 'ДА' : 'нет') + '</span></div>');
    }).catch(function(){});
  } else {
    more('<div class="row"><span class="k">SW</span><span class="v">не поддерж.</span></div>');
  }

  if (window.caches && caches.keys) {
    caches.keys().then(function(ks){
      more('<div class="row"><span class="k">Кеши SW</span><span class="v ' +
           (ks.length ? 'bad' : 'ok') + '">' + (ks.join(', ') || 'пусто') + '</span></div>');
    }).catch(function(){});
  }

  var t0 = Date.now();
  fetch('/app/?diag=' + t0, { cache: 'no-store' }).then(function(r){
    return r.text().then(function(txt){
      var ms = Date.now() - t0;
      var hasVp = /name=["']viewport["']/.test(txt);
      var hasTw = /cdn\.tailwindcss\.com/.test(txt);
      var hasPh = /phosphor-icons/.test(txt);
      more('<div class="row"><span class="k">/app/ статус</span><span class="v">' +
           r.status + ' за ' + ms + ' мс</span></div>' +
           '<div class="row"><span class="k">/app/ размер</span><span class="v">' +
           txt.length + ' симв.</span></div>' +
           '<div class="row"><span class="k">viewport в файле</span><span class="v ' +
           (hasVp ? 'ok' : 'bad') + '">' + yn(hasVp) + '</span></div>' +
           '<div class="row"><span class="k">tailwind CDN</span><span class="v ' +
           (hasTw ? 'bad' : 'ok') + '">' + (hasTw ? 'ЕСТЬ — СТАРЫЙ ФАЙЛ' : 'нет — новый файл') +
           '</span></div>' +
           '<div class="row"><span class="k">phosphor CDN</span><span class="v ' +
           (hasPh ? 'bad' : 'ok') + '">' + (hasPh ? 'ЕСТЬ — СТАРЫЙ ФАЙЛ' : 'нет — новый файл') +
           '</span></div>');
    });
  }).catch(function(e){
    more('<div class="row"><span class="k">/app/</span><span class="v bad">НЕ ЗАГРУЗИЛСЯ: ' +
         e.message + '</span></div>');
  });

  var a0 = Date.now();
  fetch('https://api.neotaro.ru/api/push/key', { cache: 'no-store' }).then(function(r){
    more('<div class="row"><span class="k">API ответ</span><span class="v ok">' +
         r.status + ' за ' + (Date.now() - a0) + ' мс</span></div>');
  }).catch(function(e){
    more('<div class="row"><span class="k">API</span><span class="v bad">НЕ ОТВЕТИЛ: ' +
         e.message + '</span></div>');
  });

  window.addEventListener('error', function(ev){
    more('<div class="row"><span class="k">JS ОШИБКА</span><span class="v bad">' +
         ev.message + ' @ ' + (ev.filename || '?') + ':' + (ev.lineno || '?') + '</span></div>');
  });
})();
</script>
</body>
</html>
